[package]
name = "az-pipeline-watch"
version = "0.1.4"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
unicode-width = "0.2"
wait-timeout = "0.2"
