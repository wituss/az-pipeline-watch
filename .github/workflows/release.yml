name: Build, test and release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Bump patch version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          manifest_path = Path("Cargo.toml")
          manifest = manifest_path.read_text()
          package = tomllib.loads(manifest)["package"]
          current = package["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", current):
              raise SystemExit(f"Expected a stable semantic version, got {current}")
          versions = [tuple(map(int, current.split(".")))]
          for tag in subprocess.check_output(["git", "tag", "--list"], text=True).splitlines():
              if re.fullmatch(r"v\d+\.\d+\.\d+", tag):
                  versions.append(tuple(map(int, tag[1:].split("."))))
          major, minor, patch = max(versions)
          version = f"{major}.{minor}.{patch + 1}"

          def replace_package_version(text, section):
              pattern = (
                  rf'(?ms)(^\[{section}\]\s*\n'
                  rf'(?:(?!^\[).)*?^version = "){re.escape(current)}(")'
              )
              updated, count = re.subn(pattern, rf"\g<1>{version}\2", text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not update version in {section}")
              return updated

          manifest_path.write_text(replace_package_version(manifest, "package"))
          lock_path = Path("Cargo.lock")
          lock = lock_path.read_text()
          pattern = (
              rf'(?m)(^\[\[package\]\]\nname = "{re.escape(package["name"])}"\n'
              rf'version = "){re.escape(current)}(")'
          )
          lock, count = re.subn(pattern, rf"\g<1>{version}\2", lock, count=1)
          if count != 1:
              raise SystemExit("Could not update package version in Cargo.lock")
          lock_path.write_text(lock)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag=v{version}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: version-manifests
          path: |
            Cargo.toml
            Cargo.lock

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: az-pipeline-watch
          - os: windows-latest
            platform: windows-x86_64
            binary: az-pipeline-watch.exe
          - os: macos-latest
            platform: macos-arm64
            binary: az-pipeline-watch
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: version-manifests

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      - name: Terminal integration tests
        if: runner.os != 'Windows'
        run: python3 tests/terminal_integration.py target/release/az-pipeline-watch

      - name: Package binary and checksum
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          dist.mkdir()
          binary = Path("target/release") / os.environ["BINARY"]
          name = f"az-pipeline-watch-{os.environ['TAG']}-{os.environ['PLATFORM']}"
          if binary.suffix == ".exe":
              archive = dist / f"{name}.zip"
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as package:
                  package.write(binary, arcname=binary.name)
          else:
              archive = dist / f"{name}.tar.gz"
              with tarfile.open(archive, "w:gz") as package:
                  package.add(binary, arcname=binary.name)
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(f"{archive}.sha256").write_text(f"{checksum}  {archive.name}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: version-manifests

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Commit version and push tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push --atomic origin HEAD:master "refs/tags/${TAG}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "${TAG}" dist/* \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes
